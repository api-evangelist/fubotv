aid: fubotv
name: fuboTV
description: 'Fubo (fuboTV) is a live TV streaming service focused on sports, offering
  more than 100 live channels covering the NFL, NBA, MLB, soccer, Formula 1, NASCAR
  and major broadcast networks (ABC, NBC, CBS, FOX), alongside news, entertainment
  and on-demand content. The service includes cloud DVR, multi-device streaming and
  no-commitment monthly plans. fuboTV was surfaced as a portfolio company of dcm-ventures
  and northzone and added to the API Evangelist network. It is a direct-to-consumer
  streaming brand and does not publish a public developer API program; this profile
  captures its public web, legal, security and identity surface.'
